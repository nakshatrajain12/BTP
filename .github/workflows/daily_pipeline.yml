name: Daily Pipeline Run

on:
  schedule:
    # Runs at 2:00 AM IST (which is 8:30 PM UTC)
    - cron: '30 20 * * *'
  workflow_dispatch: # Allows manual trigger from GH UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright with system deps
        run: |
          playwright install-deps chromium
          playwright install chromium

      - name: Run Pipeline (Bronze -> Silver -> Gold -> NLP -> Change Detection)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          make pipeline
